[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshpot"
version = "1.0.0"
description = "Small low-interaction SSH honeypot with statistics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["paramiko>=3.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sshpot = "sshpot.cli:main"

[tool.setuptools]
packages = ["sshpot"]
